<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация — Bloom Salon</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="index.html" class="logo">Bloom<span>.</span></a>
    </div>
  </header>

  <main class="form-page">
    <form class="form-box" action="login.html">
      <h1>Создать аккаунт</h1>
      <div class="row">
        <div class="field">
          <label for="first">Имя *</label>
          <input id="first" placeholder="Айгерим" pattern="[A-Za-zА-Яа-яЁё ]{2,}" required>
          <span class="error">Минимум 2 буквы</span>
        </div>
        <div class="field">
          <label for="last">Фамилия *</label>
          <input id="last" placeholder="Садыкова" pattern="[A-Za-zА-Яа-яЁё ]{2,}" required>
          <span class="error">Минимум 2 буквы</span>
        </div>
      </div>
      <div class="field">
        <label for="email">Email *</label>
        <input type="email" id="email" placeholder="you@email.com" required>
        <span class="error">Введите корректный email</span>
      </div>
      <div class="field">
        <label for="phone">Телефон</label>
        <input type="tel" id="phone" placeholder="+7 777 123 45 67" pattern="\+?[0-9 ]{10,16}">
        <span class="error">Неверный формат телефона</span>
      </div>
      <div class="field">
        <label for="dob">Дата рождения</label>
        <input type="date" id="dob" max="2014-12-31">
      </div>
      <div class="field">
        <label for="password">Пароль *</label>
        <input type="password" id="password" placeholder="••••••••" minlength="6" required>
        <span class="error">Пароль — минимум 6 символов</span>
      </div>
      <div class="field">
        <label for="confirm">Повторите пароль *</label>
        <input type="password" id="confirm" placeholder="••••••••" minlength="6" required>
        <span class="error">Пароли должны совпадать</span>
      </div>
      <button class="btn">Зарегистрироваться</button>
      <p class="bottom">Уже есть аккаунт? <a href="login.html">Войти</a></p>
    </form>
  </main>
</body>
</html>
