<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Запись — Bloom Salon</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="index.html" class="logo">Bloom<span>.</span></a>
      <input type="checkbox" id="menu-toggle">
      <label for="menu-toggle" class="burger">☰</label>
      <nav>
        <ul>
        <li><a href="index.html">Главная</a></li>
        <li><a href="services.html">Услуги</a></li>
        <li><a href="masters.html">Мастера</a></li>
        <li><a href="booking.html" class="active">Запись</a></li>
        <li><a href="about.html">О нас</a></li>
        <li><a href="profile.html">Профиль</a></li>
        <li><a href="login.html">Выйти</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="form-page">
    <form class="form-box" action="confirm.html">
      <h1>Запись в салон</h1>
      <div class="field">
        <label for="service">Услуга</label>
        <select id="service" required>
          <option value="">— выберите —</option>
          <option selected>Женская стрижка</option>
          <option>Окрашивание</option>
          <option>Маникюр</option>
          <option>Чистка лица</option>
        </select>
      </div>
      <div class="field">
        <label for="master">Мастер</label>
        <select id="master" required>
          <option>Анна Ли</option>
          <option>Дана Ким</option>
          <option>Мадина Ахметова</option>
          <option>Алия Нурлан</option>
        </select>
      </div>
      <div class="row">
        <div class="field">
          <label for="date">Дата</label>
          <input type="date" id="date" min="2026-10-12" required>
        </div>
        <div class="field">
          <label for="time">Время</label>
          <select id="time" required>
            <option value="">—</option>
            <option>10:00</option>
            <option>12:00</option>
            <option>14:00</option>
            <option>16:00</option>
            <option>18:00</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="phone">Телефон</label>
        <input type="tel" id="phone" placeholder="+7 777 123 45 67" pattern="\+?[0-9 ]{10,16}" required>
        <span class="error">Введите корректный номер телефона</span>
      </div>
      <div class="field">
        <label for="note">Пожелания</label>
        <textarea id="note" rows="3"></textarea>
      </div>
      <button class="btn">Подтвердить</button>
    </form>
  </main>

  <footer>
    <div class="container">
      <p class="logo">Bloom<span>.</span></p>
      <ul>
        <li><a href="about.html">О нас</a></li>
        <li><a href="about.html#contact">Контакты</a></li>
        <li><a href="#">Конфиденциальность</a></li>
        <li><a href="#">Условия</a></li>
      </ul>
      <ul>
        <li><a href="#">Instagram</a></li>
        <li><a href="#">Facebook</a></li>
        <li><a href="#">Telegram</a></li>
      </ul>
      <small>© 2026 Bloom Beauty Salon. Student Project</small>
    </div>
  </footer>
</body>
</html>
